<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TaskFlow</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo-area">
                <h2>📋 TaskFlow</h2>
                <p>Organize your tasks. Simplify your life.</p>
            </div>
            
            <h3>Create your account 🚀</h3>
            <p style="margin-bottom: 20px;">Sign up to get started</p>

            <form action="dashboard.html">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-control" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label>Email address</label>
                    <input type="email" class="form-control" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" placeholder="Create a password" required>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" class="form-control" placeholder="Confirm your password" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">I agree to the <a href="#" style="color: var(--primary); text-decoration: none;">Terms & Conditions</a></label>
                </div>

                <button type="submit" class="btn btn-primary">Sign Up</button>
            </form>

            <div class="divider">or continue with</div>

            <div class="social-grid">
                <button class="btn-social">🌐 Google</button>
                <button class="btn-social">🍏 Apple</button>
            </div>

            <p style="margin-top: 24px; font-size: 13px;">Already have an account? <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Login</a></p>
        </div>
    </div>

</body>
</html>
