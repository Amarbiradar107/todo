<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings - TaskFlow</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="app-layout">
        <aside class="sidebar">
            <div class="brand">📋 TaskFlow</div>
            <ul class="nav-menu">
                <li class="nav-item"><a href="dashboard.html">🏠 Dashboard</a></li>
                <li class="nav-item"><a href="tasks.html">✅ Tasks</a></li>
                <li class="nav-item"><a href="#">📅 Calendar</a></li>
                <li class="nav-item"><a href="#">📁 Categories</a></li>
                <li class="nav-item active"><a href="profile.html">⚙️ Settings</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="header-actions">
                <div>
                    <h1>Settings</h1>
                    <p style="color: var(--text-muted);">Manage account preferences and update public details.</p>
                </div>
            </div>

            <div class="profile-wrapper">
                <div class="avatar-upload">
                    <div class="avatar-preview">👨‍💻</div>
                    <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;">Change Photo</button>
                </div>

                <div class="profile-form-area">
                    <h3 style="margin-bottom: 20px;">Profile Information</h3>
                    <form action="#">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" class="form-control" value="John Doe">
                        </div>

                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" class="form-control" value="john.doe@example.com">
                        </div>

                        <div class="form-group">
                            <label>Bio</label>
                            <textarea class="form-control" rows="3">Product Designer & Task Management Enthusiast.</textarea>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: auto;">Save Changes</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
