<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TaskFlow</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo-area">
                <h2>📋 TaskFlow</h2>
                <p>Organize your tasks. Simplify your life.</p>
            </div>
            
            <h3>Welcome back! 👋</h3>
            <p style="margin-bottom: 20px;">Login to continue</p>

            <form action="dashboard.html">
                <div class="form-group">
                    <label>Email address</label>
                    <input type="email" class="form-control" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between;">
                        <label>Password</label>
                        <a href="#" style="font-size: 12px; color: var(--primary); text-decoration: none;">Forgot Password?</a>
                    </div>
                    <input type="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary">Login</button>
            </form>

            <div class="divider">or continue with</div>

            <div class="social-grid">
                <button class="btn-social">🌐 Google</button>
                <button class="btn-social">🍏 Apple</button>
            </div>

            <p style="margin-top: 24px; font-size: 13px;">Don't have an account? <a href="register.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign up</a></p>
        </div>
    </div>

</body>
</html>
