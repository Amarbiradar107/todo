<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task - TaskFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-layout">
        <aside class="sidebar">
            <div class="brand">📋 TaskFlow</div>
            <ul class="nav-menu">
                <li class="nav-item"><a href="dashboard.html">🏠 Dashboard</a></li>
                <li class="nav-item active"><a href="tasks.html">✅ Tasks</a></li>
                <li class="nav-item"><a href="#">📅 Calendar</a></li>
                <li class="nav-item"><a href="#">📁 Categories</a></li>
                <li class="nav-item"><a href="profile.html">⚙️ Settings</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="header-actions">
                <div>
                    <h1>Edit Task</h1>
                    <p style="color: var(--text-muted);">Modify values or status state for this running task instance.</p>
                </div>
            </div>

            <div class="section-card" style="max-width: 700px;">
                <form action="tasks.html">
                    <div class="form-group">
                        <label>Title *</label>
                        <input type="text" class="form-control" value="Design homepage" required>
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea class="form-control" rows="4">Create homepage design in Figma and share with the core development team.</textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Category</label>
                            <select class="form-control">
                                <option selected>Work</option>
                                <option>Personal</option>
                                <option>Study</option>
                                <option>Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Priority</label>
                            <select class="form-control">
                                <option>High</option>
                                <option selected>Medium</option>
                                <option>Low</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Due Date</label>
                            <input type="date" class="form-control" value="2026-05-20">
                        </div>
                        <div class="form-group">
                            <label>Due Time</label>
                            <input type="time" class="form-control" value="13:00">
                        </div>
                    </div>

                    <div style="display: flex; justify-content: space-between; margin-top: 24px;">
                        <button type="button" class="btn btn-danger" style="width: auto;">Delete Task</button>
                        <div style="display: flex; gap: 12px;">
                            <a href="tasks.html" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary" style="width: auto;">Update Task</button>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>

</body>
</html>
