<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/login.css">
    <title>login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>

    <div class="login-page" id="login-page" >
        <div class="title" id="login-title">Login Screen</div>
        <div id="rightside">
            <div  id="welcome">
                <h2 class="text-center">Welcome</h2>
            </div>

            <div id="loginform">
                <form action="/login" method="post">
                    <div id="username">
                        <label for="username" style="font-size: large;">Username:</label> 
                        <input class="form-control" type="text" id="username" name="username" placeholder="Username"><br><br>
                    </div>

                    <div id="password">
                        <label for="password" style="font-size: large;">Password:</label>
                        <input class="form-control" type="password" id="password" name="password" placeholder="Password" required><br><br>
                    </div>
                    
                    <div id="submitbtn">
                        <input class="btn btn-primary" type="submit" value="Login">
                    </div>
                </form>
            </div>
            
        </div>

        <div id="leftside">
            <div class="info" id="info" >
                <h1 >TaskFlow</h1>
                <p>Organize your tasks. Simplify your life.</p>
            </div>
        </div>
    </div>
</body>
</html>
